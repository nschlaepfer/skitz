[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skitz-music"
version = "0.1.0"
description = "Editable music projects and verified revisions for the Skitz Prime Agent harness"
requires-python = ">=3.11"
dependencies = ["music21>=10.5.0,<11", "pydantic>=2.14.1,<3"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
suno = ["httpx>=0.27,<1", "websocket-client>=1.8,<2"]
claude = ["anthropic>=2.0.0,<3"]
# Effects, time-stretch and pitch-shift for `skitz samples fit/fx/layer`.
fx = ["pedalboard>=0.9.26,<1"]

[project.scripts]
skitz = "skitz_music.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skitz_music"]
