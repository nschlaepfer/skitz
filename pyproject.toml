[project]
name = "skitz-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["skitz-music[mcp,suno,claude]"]

[tool.uv.workspace]
members = ["packages/skitz-music"]

[tool.uv.sources]
skitz-music = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff>=0.17.0,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
